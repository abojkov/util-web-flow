rogress span{display:block;height:100%;background:#2c70f0;border-radius:20px}.budget-row{padding:15px 0;border-bottom:1px solid #edf1f7}.budget-row:last-child{border:0}.budget-row .head{display:flex;justify-content:space-between;font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#11213c88;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:22px;width:min(100%,540px);max-height:min(90vh,850px);overflow-y:auto;padding:25px;box-shadow:0 30px 80px #10244855}.modal h2{font:800 20px 'Plus Jakarta Sans';margin:0}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.close{border:0;background:#f1f5fb;color:#61758e;border-radius:9px;width:32px;height:32px;font-size:20px}.modal-footer{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.segmented{display:flex;background:#f1f5fb;padding:4px;border-radius:12px;margin-bottom:18px}.segmented button{flex:1;border:0;border-radius:9px;background:transparent;padding:11px 3px;font-size:12px;font-weight:800;color:#8da0ba}.segmented button.active{background:#fff;color:#2465eb;box-shadow:0 2px 8px #233b6517}.notice{padding:13px;border-radius:12px;background:#edf5ff;color:#4e6b94;font-size:12px;line-height:1.6}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.settings-tile{padding:20px;border:1px solid #e8eff8;border-radius:15px;background:#fff}.settings-tile h3{margin:0 0 9px;font-size:15px}.settings-tile p{color:#8e9eb5;font-size:12px;line-height:1.6;min-height:40px}.toast{position:fixed;bottom:90px;right:25px;background:#18385f;color:#fff;padding:13px 20px;border-radius:12px;z-index:60;box-shadow:0 10px 30px #13274633;font-size:13px}.bottom-nav{display:none}.form-hint{font-size:11px;color:#92a0b5}.mobile-only{display:none}@media(max-width:1100px){.summary-grid{grid-template-columns:1fr 1fr}.balance-card{grid-column:span 2}.section-grid{grid-template-columns:1fr}.account-grid{grid-template-colu </style></head><body><div id="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">◈</span><span>flow<span class="brand-dot">.</span></span></div><p class="side-caption">PERSONAL FINANCE</p><nav id="side-nav"></nav><div class="sidebar-foot"><div class="avatar">F</div><div><b>My workspace</b><small>Offline & private</small></div></div></aside><div class="shell"><header class="topbar"><div class="brand mobile-brand"><span class="brand-icon">◈</span><span>flow<span class="brand-dot">.</span></span></div><div class="top-left"><span class="eyebrow">PERSONAL FINANCE</span><h1 id="page-title">Overview</h1></div><div class="top-actions"><span class="offline"><span class="dot"></span> Offline first</span><button class="icon-btn" id="settings-shortcut" title="Settings">⚙</button></div></header><main id="view"></main></div><nav class="bottom-nav" id="bottom-nav"></nav><div id="modal-root"></div><div id="toast-root"></div></div><script>
const NAME='flow-money-manager', VERSION=1;
const STORES=['accounts','categories','transactions','budgets','recurring','settings'];
let dbPromise;
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(NAME,VERSION);r.onupgradeneeded=()=>{for(const name of STORES)if(!r.result.objectStoreNames.contains(name))r.result.createObjectStore(name,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function all(store){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function put(store,item){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=()=>res(item);tx.onerror=()=>rej(tx.error)})}
async function del(store,id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function replaceAll(data){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORES,'readwrite');for(const store of STORES){tx.objectStore(store).clear();for(const item of data[store]||[])tx.objectStore(store).put(item)}tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
const storeNames=STORES;

const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), today=()=>new Date().toLocaleDateString('en-CA');
const icons={home:'⌂',transactions:'≡',statistics:'◉',accounts:'▣',more:'☷'};
const names={home:'Overview',transactions:'Transactions',statistics:'Statistics',accounts:'Accounts',more:'More'};
const defaults=[['Food & Drinks','🍽️','#fb923c','expense'],['Shopping','🛍️','#a78bfa','expense'],['Transport','🚙','#60a5fa','expense'],['Bills','🧾','#2dd4bf','expense'],['Health','♥','#fb7185','expense'],['Home','⌂','#fbbf24','expense'],['Travel','✈','#38bdf8','expense'],['Other Expense','◈','#94a3b8','expense'],['Salary','💼','#34d399','income'],['Gift','🎁','#a78bfa','income'],['Interest','↗','#60a5fa','income'],['Other Income','◈','#94a3b8','income']];
let state={page:'home',accounts:[],transactions:[],categories:[],budgets:[],recurring:[],settings:[],month:today().slice(0,7),accountFilter:'all',txType:'expense',statsPeriod:'month',statsAccount:'all'};
const getSetting=(k,d)=>state.settings.find(x=>x.id===k)?.value??d;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='EUR')=>new Intl.NumberFormat('en-GB',{style:'currency',currency:c,maximumFractionDigits:2}).format(n||0);
const fmt=(n,c)=>money(n,c);
const amount=x=>Math.round((Number(x)||0)*100)/100;
const monthLabel=m=>new Date(m+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
const account=id=>state.accounts.find(a=>a.id===id);
const cat=id=>state.categories.find(c=>c.id===id);
const rates={EUR:1,USD:1.09,GBP:.86,MKD:61.5,CHF:.94,SEK:11.2};
function converted(v,c){const base=getSetting('baseCurrency','EUR');if(c===base)return v;const from=rates[c],to=rates[base];return from&&to?v/from*to:0}
function balance(a){return amount(Number(a.opening||0)+state.transactions.reduce((sum,t)=>sum+(t.type==='income'&&t.accountId===a.id?t.amount:t.type==='expense'&&t.accountId===a.id?-t.amount:t.type==='transfer'&&t.accountId===a.id?-t.amount:t.type==='transfer'&&t.toAccountId===a.id?t.received:0),0))}
function txs(){return state.transactions.filter(t=>t.date?.startsWith(state.month)&&(state.accountFilter==='all'||t.accountId===state.accountFilter||t.toAccountId===state.accountFilter))}
function totals(){const ts=txs();return {income:ts.filter(t=>t.type==='income').reduce((s,t)=>s+converted(t.amount,account(t.accountId)?.currency||'EUR'),0),expense:ts.filter(t=>t.type==='expense').reduce((s,t)=>s+converted(t.amount,account(t.accountId)?.currency||'EUR'),0)}}
const base=()=>getSetting('baseCurrency','EUR');
async function reload(){for(const name of storeNames)state[name]=await all(name);render()}
function nav(){const entries=Object.keys(names);$('#side-nav').innerHTML=entries.map(k=>`<button class="nav-item ${state.page===k?'active':''}" data-page="${k}"><span class="nav-icon">${icons[k]}</span>${names[k]}</button>`).join('');$('#bottom-nav').innerHTML=entries.map(k=>`<button class="${state.page===k?'active':''}" data-page="${k}"><span>${icons[k]}</span>${k==='home'?'Home':names[k]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render();scrollTo(0,0)})}
function empty(title,desc,icon='◈'){return `<div class="empty"><div class="empty-icon">${icon}</div><b>${title}</b><p>${desc}</p></div>`}
function monthControl(){return `<div class="filter-row"><button class="icon-btn" id="prev-month">‹</button><strong style="font-size:13px;min-width:130px;text-align:center">${monthLabel(state.month)}</strong><button class="icon-btn" id="next-month">›</button></div>`}
function bindMonth(){const shift=d=>{const [y,m]=state.month.split('-').map(Number);const dt=new Date(y,m-1+d,1);state.month=dt.toISOString().slice(0,7);render()};$('#prev-month')?.addEventListener('click',()=>shift(-1));$('#next-month')?.addEventListener('click',()=>shift(1))}
function accountSelect(id='account-filter'){return `<select class="select" id="${id}"><option value="all">All accounts</option>${state.accounts.filter(a=>!a.archived).map(a=>`<option value="${a.id}" ${state.accountFilter===a.id?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select>`}
function txList(items){if(!items.length)return empty('No transactions yet','Your financial activity will appear here.','↗');return items.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).map(t=>{const a=account(t.accountId),c=cat(t.categoryId),label=t.type==='transfer'?`Transfer to ${account(t.toAccountId)?.name||'account'}`:(t.note||c?.name||t.type);return `<div class="transaction"><div class="tx-icon">${t.type==='transfer'?'⇄':c?.icon||'◈'}</div><div class="tx-main"><b>${escapeHtml(label)}</b><small>${escapeHtml(a?.name||'Unknown account')} · ${escapeHtml(t.date)}</small></div><div class="tx-amount ${t.type}">${t.type==='expense'?'−':t.type==='income'?'+':''}${fmt(t.amount,a?.currency||'EUR')}</div><div class="tx-actions"><button class="mini-btn" data-edit-tx="${t.id}" title="Edit">✎</button><button class="mini-btn" data-delete-tx="${t.id}" title="Delete">×</button></div></div>`}).join('')}
function spendingByCategory(items){const map=new Map();for(const t of items.filter(t=>t.type==='expense')){const splits=t.splits?.length?t.splits:[{categoryId:t.categoryId,amount:t.amount}];for(const s of splits){const id=s.categoryId||'other';map.set(id,(map.get(id)||0)+converted(s.amount,account(t.accountId)?.currency||'EUR'))}}return [...map].map(([id,value])=>({name:cat(id)?.name||'Other',value,color:cat(id)?.color||'#94a3b8'})).sort((a,b)=>b.value-a.value)}
function donut(items){const groups=spendingByCategory(items),sum=groups.reduce((s,x)=>s+x.value,0);if(!sum)return empty('Nothing to analyze yet','Add an expense to see your spending breakdown.','◉');let pct=0;const segments=groups.map(x=>{const a=pct;pct+=x.value/sum*100;return `${x.color} ${a}% ${pct}%`}).join(',');return `<div class="chart-wrap"><div class="donut" style="background:conic-gradient(${segments})"><div class="donut-hole"><div><strong>${money(sum,base())}</strong><br><small>Total spent</small></div></div></div><div class="legend">${groups.slice(0,6).map(x=>`<div class="legend-item"><span><i class="legend-dot" style="background:${x.color}"></i>${escapeHtml(x.name)}</span><b>${Math.round(x.value/sum*100)}%</b></div>`).join('')}</div></div>`}
function home(){const ts=txs(),t=totals(),active=state.accounts.filter(a=>!a.archived),total=state.accountFilter==='all'?active.reduce((s,a)=>s+converted(balance(a),a.currency),0):balance(account(state.accountFilter)||{id:'',opening:0});const cur=state.accountFilter==='all'?base():account(state.accountFilter)?.currency||base();return `<div class="welcome"><div><h2>Welcome to your money space 👋</h2><div class="muted">A clearer picture of your finances, every day.</div></div><button class="btn" data-add="transaction">+ Add transaction</button></div><div class="toolbar">${monthControl()}${accountSelect()}</div><div class="grid summary-grid"><section class="balance-card"><p>Total balance</p><h2>${money(total,cur)}</h2><footer>◈ ${state.accountFilter==='all'?active.length+' active accounts':escapeHtml(account(state.accountFilter)?.name||'Account')} · ${state.accountFilter==='all'?'Estimated base-currency total':'Native currency'}</footer></section><section class="stat-card"><span class="stat-icon">↙</span><div class="label">Monthly income</div><div class="stat-value income">${money(t.income,base())}</div><div class="stat-bottom">For ${monthLabel(state.month)}</div></section><section class="stat-card"><span class="stat-icon expense-icon">↗</span><div class="label">Monthly expenses</div><div class="stat-value expense">${money(t.expense,base())}</div><div class="stat-bottom">For ${monthLabel(state.month)}</div></section></div><div class="section-grid"><section class="panel"><div class="panel-head"><h3>Recent transactions</h3><button class="link-btn" data-page="transactions">View all →</button></div>${txList(ts.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</section><section class="panel"><div class="panel-head"><h3>Spending breakdown</h3><span class="pill">${monthLabel(state.month)}</span></div>${donut(ts)}</section></div><div class="section-grid"><section class="panel"><div class="panel-head"><h3>Quick actions</h3></div><div class="quick-actions"><button class="quick-action" data-add="expense"><span>↗</span>Add expense</button><button class="quick-action" data-add="income"><span>↙</span>Add income</button><button class="quick-action" data-add="transfer"><span>⇄</span>Transfer</button></div></section><section class="panel"><div class="panel-head"><h3>Your accounts</h3><button class="link-btn" data-page="accounts">Manage →</button></div>${active.length?active.slice(0,4).map(a=>`<div class="transaction"><div class="tx-icon">▣</div><div class="tx-main"><b>${escapeHtml(a.name)}</b><small>${a.currency} · ${escapeHtml(a.type)}</small></div><b>${money(balance(a),a.currency)}</b></div>`).join(''):empty('No accounts yet','Create your first account to begin.','▣')}</section></div>`}
function transactions(){const items=txs();return `<div class="toolbar"><div><h2>Transaction history</h2><p class="muted">Every movement, all in one place.</p></div><button class="btn" data-add="transaction">+ New transaction</button></div><div class="toolbar">${monthControl()}${accountSelect()}</div><section class="table-list">${txList(items)}</section>`}
function statistics(){const ts=txs(),t=totals();return `<div class="toolbar"><div><h2>Financial insights</h2><p class="muted">Understand where your money goes.</p></div>${monthControl()}</div><div class="grid summary-grid"><section class="balance-card"><p>Net cash flow</p><h2>${money(t.income-t.expense,base())}</h2><footer>Income minus expenses</footer></section><section class="stat-card"><div class="label">Income</div><div class="stat-value income">${money(t.income,base())}</div></section><section class="stat-card"><div class="label">Expenses</div><div class="stat-value expense">${money(t.expense,base())}</div></section></div><div class="section-grid"><section class="panel"><div class="panel-head"><h3>Expenses by category</h3></div>${donut(ts)}</section><section class="panel"><div class="panel-head"><h3>Category details</h3></div>${spendingByCategory(ts).length?spendingByCategory(ts).map(x=>`<div class="budget-row"><div class="head"><b>${escapeHtml(x.name)}</b><b>${money(x.value,base())}</b></div><div class="progress"><span style="width:${t.expense?Math.min(100,x.value/t.expense*100):0}%;background:${x.color}"></span></div></div>`).join(''):empty('No spending data','Your categories will appear here.','◉')}</section></div><p class="muted" style="margin-top:15px">Cross-currency totals use editable reference rates and are estimates. Original transaction amounts remain unchanged.</p>`}
function accounts(){const active=state.accounts.filter(a=>!a.archived),archived=state.accounts.filter(a=>a.archived);const cards=arr=>arr.map(a=>`<div class="account-card"><div class="account-symbol">▣</div><h3>${escapeHtml(a.name)} ${a.archived?'<span class="pill">Archived</span>':''}</h3><strong>${money(balance(a),a.currency)}</strong><p>${escapeHtml(a.type)} · ${a.currency}</p><div class="actions"><button class="btn ghost" data-edit-account="${a.id}">Edit</button><button class="btn secondary" data-archive="${a.id}">${a.archived?'Restore':'Archive'}</button><button class="btn danger" data-delete-account="${a.id}">Delete</button></div></div>`).join('');return `<div class="toolbar"><div><h2>My accounts</h2><p class="muted">Keep every balance in view.</p></div><button class="btn" data-add="account">+ Add account</button></div>${active.length?`<div class="account-grid">${cards(active)}</div>`:empty('Create your first account','Add a bank, cash, or savings account to get started.','▣')}${archived.length?`<h3 style="margin-top:32px">Archived accounts</h3><div class="account-grid">${cards(archived)}</div>`:''}`}
function more(){const current=state.budgets.filter(b=>b.month===state.month);return `<div class="toolbar"><div><h2>Manage your money</h2><p class="muted">Budgets, categories, automation and preferences.</p></div></div><div class="settings-grid"><section class="settings-tile"><h3>◉ Monthly budgets</h3><p>Set monthly spending limits without carry-over.</p><button class="btn secondary" id="open-budgets">Manage budgets</button></section><section class="settings-tile"><h3>◈ Categories</h3><p>Customize expense and income categories, icons and colors.</p><button class="btn secondary" id="open-categories">Manage categories</button></section><section class="settings-tile"><h3>↻ Recurring transactions</h3><p>Schedule regular income and expenses, processed when the app opens.</p><button class="btn secondary" id="open-recurring">Manage schedules</button></section><section class="settings-tile"><h3>⚙ Settings & backup</h3><p>Currency, data export and import, and privacy options.</p><button class="btn secondary" id="open-settings">Open settings</button></section></div><section class="panel" style="margin-top:20px"><div class="panel-head"><h3>Budget overview · ${monthLabel(state.month)}</h3><button class="link-btn" id="budget-quick">Manage →</button></div>${current.length?current.map(b=>{const spent=state.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(state.month)).reduce((s,t)=>s+(t.splits?.length?t.splits.filter(x=>x.categoryId===b.categoryId).reduce((a,x)=>a+converted(x.amount,account(t.accountId)?.currency||'EUR'),0):t.categoryId===b.categoryId?converted(t.amount,account(t.accountId)?.currency||'EUR'):0),0);return `<div class="budget-row"><div class="head"><b>${escapeHtml(cat(b.categoryId)?.name||'Overall budget')}</b><b>${money(spent,base())} / ${money(b.limit,base())}</b></div><div class="progress"><span style="width:${Math.min(100,spent/b.limit*100)}%;background:${spent>b.limit?'#f16a76':'#3479f4'}"></span></div></div>`}).join(''):empty('No budgets set','Create a monthly budget to track spending.','◉')}</section>`}
function render(){nav();$('#page-title').textContent=names[state.page];$('#view').innerHTML=({home,transactions,statistics,accounts,more})[state.page]();bindMonth();$('#account-filter')?.addEventListener('change',e=>{state.accountFilter=e.target.value;render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(b.dataset.add==='account')accountModal();else transactionModal(null,b.dataset.add==='transaction'?'expense':b.dataset.add)});document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>accountModal(account(b.dataset.editAccount)));document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{const a=account(b.dataset.archive);await put('accounts',{...a,archived:!a.archived});await reload()});document.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=async()=>{const a=account(b.dataset.deleteAccount);if(state.transactions.some(t=>t.accountId===a.id||t.toAccountId===a.id))return toast('Account has transactions. Archive it instead.');if(confirm(`Delete ${a.name}?`)){await del('accounts',a.id);await reload()}});document.querySelectorAll('[data-edit-tx]').forEach(b=>b.onclick=()=>transactionModal(state.transactions.find(t=>t.id===b.dataset.editTx)));document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this transaction?')){await del('transactions',b.dataset.deleteTx);await reload()}});$('#open-categories')?.addEventListener('click',categoriesModal);$('#open-budgets')?.addEventListener('click',budgetsModal);$('#budget-quick')?.addEventListener('click',budgetsModal);$('#open-recurring')?.addEventListener('click',recurringModal);$('#open-settings')?.addEventListener('click',settingsModal)}
function modal(title,body){$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="close" id="close-modal">×</button></div>${body}</div></div>`;$('#close-modal').onclick=closeModal;$('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()})}
function closeModal(){$('#modal-root').innerHTML=''}
function toast(s){$('#toast-root').innerHTML=`<div class="toast">${escapeHtml(s)}</div>`;setTimeout(()=>{$('#toast-root').innerHTML=''},3500)}
const currencies=['EUR','USD','GBP','MKD','CHF','SEK'];
function currencyOptions(current){return currencies.map(c=>`<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join('')}
function accountModal(a){modal(a?'Edit account':'New account',`<form id="account-form"><div class="field"><label>Account name</label><input name="name" required maxlength="70" value="${escapeHtml(a?.name||'')}" placeholder="e.g. Main bank account"></div><div class="field-row"><div class="field"><label>Account type</label><select name="type">${['Bank','Cash','Savings','Investment','Loan','Other'].map(x=>`<option ${a?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Currency</label><select name="currency" ${a?'disabled':''}>${currencyOptions(a?.currency||base())}</select></div></div><div class="field"><label>Opening balance</label><input type="number" step="0.01" name="opening" value="${a?.opening??0}" required></div><div class="notice">Opening balances are used to calculate your balance. Currency cannot be changed after account creation.</div><div class="modal-footer"><button class="btn ghost" type="button" id="cancel">Cancel</button><button class="btn" type="submit">Save account</button></div></form>`);$('#cancel').onclick=closeModal;$('#account-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('accounts',{id:a?.id||uid(),name:f.get('name').trim(),type:f.get('type'),currency:a?.currency||f.get('currency'),opening:amount(f.get('opening')),archived:a?.archived||false});closeModal();await reload();toast('Account saved')}}
function transactionModal(t,initial='expense'){const active=state.accounts.filter(a=>!a.archived);if(!active.length){toast('Create an account first');return accountModal()}const type=t?.type||initial;const accountOpts=(sel)=>active.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${escapeHtml(a.name)} (${a.currency})</option>`).join('');modal(t?'Edit transaction':'New transaction',`<form id="tx-form"><div class="segmented">${['expense','income','transfer'].map(x=>`<button type="button" data-type="${x}" class="${x===type?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="field-row"><div class="field"><label>Amount</label><input type="number" name="amount" min="0.01" step="0.01" value="${t?.amount??''}" required placeholder="0.00"></div><div class="field"><label>Date</label><input type="date" name="date" value="${t?.date||today()}" required></div></div><div class="field"><label>Account</label><select name="accountId" id="tx-account">${accountOpts(t?.accountId||active[0].id)}</select></div><div id="tx-extra"></div><div class="field"><label>Note (optional)</label><input name="note" maxlength="180" value="${escapeHtml(t?.note||'')}" placeholder="What was this for?"></div><div class="modal-footer"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" type="submit">Save transaction</button></div></form>`);let chosen=type;const extra=()=>{const options=state.categories.filter(c=>c.type===chosen).map(c=>`<option value="${c.id}" ${c.id===t?.categoryId?'selected':''}>${escapeHtml(c.icon+' '+c.name)}</option>`).join('');$('#tx-extra').innerHTML=chosen==='transfer'?`<div class="field"><label>Destination account</label><select name="toAccountId" id="tx-to">${accountOpts(t?.toAccountId||active.find(a=>a.id!==$('#tx-account').value)?.id||'')}</select></div><div class="field"><label>Amount received (destination currency)</label><input type="number" name="received" min="0.01" step="0.01" value="${t?.received??''}" required placeholder="0.00"></div><p class="form-hint">For same-currency transfers, enter the same amount. For different currencies, enter the actual received amount.</p>`:`<div class="field"><label>Category</label><select name="categoryId">${options}</select></div><div class="field" id="split-container"><label><input type="checkbox" id="enable-splits" ${t?.splits?.length?'checked':''} style="width:auto"> Split into categories</label><div id="split-fields"></div></div>`;if(chosen!=='transfer'){const toggle=$('#enable-splits'),container=$('#split-fields');const draw=()=>{container.innerHTML=toggle.checked?`<div id="split-rows"></div><button type="button" class="btn secondary" id="add-split" style="margin-top:9px">+ Add split</button><p class="form-hint">Split amounts must equal the transaction total.</p>`:'';if(toggle.checked){let rows=t?.splits?.length?t.splits:[{categoryId:state.categories.find(c=>c.type===chosen)?.id,amount:''},{categoryId:state.categories.find(c=>c.type===chosen)?.id,amount:''}];const addRow=s=>{const el=document.createElement('div');el.className='field-row split-row';el.innerHTML=`<div class="field"><label>Category</label><select class="split-cat">${state.categories.filter(c=>c.type===chosen).map(c=>`<option value="${c.id}" ${c.id===s.categoryId?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input class="split-amount" type="number" min="0.01" step="0.01" value="${s.amount??''}" required></div>`;$('#split-rows').append(el)};rows.forEach(addRow);$('#add-split').onclick=()=>addRow({})}};toggle.onchange=draw;draw()}};extra();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{chosen=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));extra()});$('#cancel').onclick=closeModal;$('#tx-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),from=account(f.get('accountId'));if(!from)return toast('Select an account');const v=amount(f.get('amount'));if(v<=0)return toast('Enter a valid amount');let record={id:t?.id||uid(),type:chosen,amount:v,date:f.get('date'),accountId:from.id,note:String(f.get('note')||'').trim(),createdAt:t?.createdAt||new Date().toISOString()};if(chosen==='transfer'){const to=account(f.get('toAccountId'));if(!to||to.id===from.id)return toast('Select a different destination account');record.toAccountId=to.id;record.received=amount(f.get('received'));if(record.received<=0)return toast('Enter the amount received')}else{record.categoryId=f.get('categoryId');if($('#enable-splits')?.checked){record.splits=[...document.querySelectorAll('.split-row')].map(row=>({categoryId:row.querySelector('.split-cat').value,amount:amount(row.querySelector('.split-amount').value)}));if(Math.round(record.splits.reduce((s,x)=>s+x.amount,0)*100)!==Math.round(v*100))return toast('Split amounts must equal the total');record.categoryId=null}}await put('transactions',record);closeModal();await reload();toast('Transaction saved')}}
function categoriesModal(){modal('Manage categories',`<div class="toolbar"><span class="muted">Organize your income and expenses</span><button class="btn" id="new-category">+ New</button></div><div class="table-list">${state.categories.map(c=>`<div class="transaction"><div class="tx-icon" style="background:${c.color}20;color:${c.color}">${escapeHtml(c.icon)}</div><div class="tx-main"><b>${escapeHtml(c.name)}</b><small>${c.type}</small></div><button class="mini-btn" data-edit-category="${c.id}">✎</button><button class="mini-btn" data-remove-category="${c.id}">×</button></div>`).join('')}</div>`);$('#new-category').onclick=()=>categoryEdit();document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>categoryEdit(cat(b.dataset.editCategory)));document.querySelectorAll('[data-remove-category]').forEach(b=>b.onclick=async()=>{if(state.transactions.some(t=>t.categoryId===b.dataset.removeCategory||t.splits?.some(s=>s.categoryId===b.dataset.removeCategory)))return toast('Category is in use');if(confirm('Delete category?')){await del('categories',b.dataset.removeCategory);await reload();categoriesModal()}})}
function categoryEdit(c){modal(c?'Edit category':'New category',`<form id="category-form"><div class="field"><label>Name</label><input name="name" required maxlength="45" value="${escapeHtml(c?.name||'')}"></div><div class="field-row"><div class="field"><label>Type</label><select name="type" ${c?'disabled':''}><option value="expense" ${c?.type==='expense'?'selected':''}>Expense</option><option value="income" ${c?.type==='income'?'selected':''}>Income</option></select></div><div class="field"><label>Icon (emoji or symbol)</label><input name="icon" maxlength="4" value="${escapeHtml(c?.icon||'◈')}"></div></div><div class="field"><label>Color</label><input name="color" type="color" value="${c?.color||'#3b82f6'}" style="height:48px"></div><div class="modal-footer"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Save category</button></div></form>`);$('#cancel').onclick=categoriesModal;$('#category-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('categories',{id:c?.id||uid(),name:f.get('name').trim(),type:c?.type||f.get('type'),icon:f.get('icon')||'◈',color:f.get('color')});await reload();categoriesModal()}}
function budgetsModal(){const items=state.budgets.filter(b=>b.month===state.month);modal('Monthly budgets',`<div class="toolbar">${monthControl()}<button class="btn" id="new-budget">+ Add budget</button></div><div class="table-list">${items.length?items.map(b=>`<div class="transaction"><div class="tx-icon">◉</div><div class="tx-main"><b>${escapeHtml(cat(b.categoryId)?.name||'Overall budget')}</b><small>${monthLabel(b.month)}</small></div><b>${money(b.limit,base())}</b><button class="mini-btn" data-remove-budget="${b.id}">×</button></div>`).join(''):empty('No budgets this month','Add a limit for your spending.')}</div>`);bindMonth();$('#prev-month').onclick=()=>{shiftBudget(-1)};$('#next-month').onclick=()=>{shiftBudget(1)};$('#new-budget').onclick=budgetEdit;document.querySelectorAll('[data-remove-budget]').forEach(b=>b.onclick=async()=>{await del('budgets',b.dataset.removeBudget);await reload();budgetsModal()})}
function shiftBudget(n){const [y,m]=state.month.split('-').map(Number);state.month=new Date(y,m-1+n,1).toISOString().slice(0,7);render();budgetsModal()}
function budgetEdit(){modal('Add monthly budget',`<form id="budget-form"><div class="field"><label>Month</label><input name="month" type="month" value="${state.month}" required></div><div class="field"><label>Category</label><select name="categoryId"><option value="">Overall budget</option>${state.categories.filter(c=>c.type==='expense').map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select></div><div class="field"><label>Monthly limit (${base()})</label><input name="limit" type="number" min="0.01" step="0.01" required></div><div class="notice">Budgets reset each month. No unused amount is carried forward.</div><div class="modal-footer"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Save budget</button></div></form>`);$('#cancel').onclick=budgetsModal;$('#budget-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),month=f.get('month'),categoryId=f.get('categoryId');const old=state.budgets.find(b=>b.month===month&&b.categoryId===categoryId);await put('budgets',{id:old?.id||uid(),month,categoryId,limit:amount(f.get('limit'))});await reload();budgetsModal()}}
function recurringModal(){modal('Recurring transactions',`<div class="toolbar"><span class="muted">Scheduled items are added when you open the app.</span><button class="btn" id="new-recurring">+ New</button></div><div class="table-list">${state.recurring.length?state.recurring.map(r=>`<div class="transaction"><div class="tx-icon">↻</div><div class="tx-main"><b>${escapeHtml(r.note||cat(r.categoryId)?.name||'Recurring')}</b><small>${r.frequency} · next ${r.nextDate} · ${r.paused?'Paused':'Active'}</small></div><b>${money(r.amount,account(r.accountId)?.currency||base())}</b><button class="mini-btn" data-pause="${r.id}">${r.paused?'▶':'Ⅱ'}</button><button class="mini-btn" data-remove-recurring="${r.id}">×</button></div>`).join(''):empty('No recurring transactions','Add regular salary, rent, or subscriptions.','↻')}</div>`);$('#new-recurring').onclick=recurringEdit;document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=async()=>{const r=state.recurring.find(x=>x.id===b.dataset.pause);await put('recurring',{...r,paused:!r.paused});await reload();recurringModal()});document.querySelectorAll('[data-remove-recurring]').forEach(b=>b.onclick=async()=>{if(confirm('Remove schedule? Existing transactions stay intact.')){await del('recurring',b.dataset.removeRecurring);await reload();recurringModal()}})}
function recurringEdit(){const active=state.accounts.filter(a=>!a.archived);if(!active.length)return accountModal();modal('New recurring transaction',`<form id="rec-form"><div class="field-row"><div class="field"><label>Type</label><select name="type" id="rec-type"><option value="expense">Expense</option><option value="income">Income</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0.01" step="0.01" required></div></div><div class="field"><label>Account</label><select name="accountId">${active.map(a=>`<option value="${a.id}">${escapeHtml(a.name)} (${a.currency})</option>`).join('')}</select></div><div class="field"><label>Category</label><select name="categoryId" id="rec-cat"></select></div><div class="field-row"><div class="field"><label>Frequency</label><select name="frequency"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="yearly">Yearly</option></select></div><div class="field"><label>First date</label><input name="nextDate" type="date" value="${today()}" required></div></div><div class="field"><label>Note</label><input name="note" maxlength="180"></div><div class="modal-footer"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn">Create schedule</button></div></form>`);const fill=()=>{$('#rec-cat').innerHTML=state.categories.filter(c=>c.type===$('#rec-type').value).map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')};$('#rec-type').onchange=fill;fill();$('#cancel').onclick=recurringModal;$('#rec-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('recurring',{id:uid(),type:f.get('type'),amount:amount(f.get('amount')),accountId:f.get('accountId'),categoryId:f.get('categoryId'),frequency:f.get('frequency'),nextDate:f.get('nextDate'),note:f.get('note'),paused:false});await reload();recurringModal()}}
function nextDate(date,freq){const d=new Date(date+'T12:00:00');const day=d.getDate();if(freq==='daily')d.setDate(day+1);if(freq==='weekly')d.setDate(day+7);if(freq==='monthly'){d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}if(freq==='yearly')d.setFullYear(d.getFullYear()+1);return d.toLocaleDateString('en-CA')}
async function processRecurring(){const rs=await all('recurring'),existing=await all('transactions');let changed=false;for(const r of rs){if(r.paused)continue;let count=0;while(r.nextDate<=today()&&count++<120){const key=`rec-${r.id}-${r.nextDate}`;if(!existing.some(t=>t.id===key))await put('transactions',{id:key,type:r.type,amount:r.amount,date:r.nextDate,accountId:r.accountId,categoryId:r.categoryId,note:r.note,createdAt:new Date().toISOString()});r.nextDate=nextDate(r.nextDate,r.frequency);changed=true}if(count>1)await put('recurring',r)}return changed}
function download(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function settingsModal(){modal('Settings & backup',`<div class="field"><label>Base currency</label><select id="base-currency">${currencyOptions(base())}</select></div><div class="notice">Multi-currency dashboard totals use indicative built-in reference rates, not live market rates. Update the rates in the source before relying on converted reports.</div><div style="display:grid;gap:12px;margin-top:18px"><button class="btn secondary" id="export-json">↓ Export full JSON backup</button><button class="btn secondary" id="export-csv">↓ Export transactions as CSV</button><label class="btn ghost" style="text-align:center;cursor:pointer">↑ Import JSON backup<input id="import-json" type="file" accept="application/json,.json" hidden></label></div><p class="form-hint">Importing a backup replaces all existing data. Export a backup first.</p><div class="notice" style="margin-top:14px">Security: this version stores financial records locally in IndexedDB without encryption. PIN locking is planned for a later phase; do not treat browser storage as encrypted.</div>`);$('#base-currency').onchange=async e=>{await put('settings',{id:'baseCurrency',value:e.target.value});await reload();settingsModal()};$('#export-json').onclick=async()=>{const data={format:'flow-backup',version:1,exportedAt:new Date().toISOString()};for(const s of storeNames)data[s]=await all(s);download(JSON.stringify(data,null,2),'flow-backup-'+today()+'.json','application/json');toast('Backup exported')};$('#export-csv').onclick=()=>{const fields=['date','type','account','currency','amount','category','note','destination','received'];const csv=[fields,...state.transactions.map(t=>[t.date,t.type,account(t.accountId)?.name||'',account(t.accountId)?.currency||'',t.amount,cat(t.categoryId)?.name||'',t.note||'',account(t.toAccountId)?.name||'',t.received||''])].map(row=>row.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('\ufeff'+csv,'flow-transactions-'+today()+'.csv','text/csv;charset=utf-8');toast('CSV exported')};$('#import-json').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='flow-backup'||data.version!==1||!storeNames.every(s=>Array.isArray(data[s])))throw Error('Unsupported backup format');if(!confirm('Replace ALL current data with this backup?'))return;await replaceAll(data);closeModal();await reload();toast('Backup restored')}catch(err){toast('Import failed: '+err.message)}}}
$('#settings-shortcut').onclick=settingsModal;
(async()=>{try{await reload();if(!state.categories.length){for(const [name,icon,color,type] of defaults)await put('categories',{id:uid(),name,icon,color,type})}await processRecurring();await reload()}catch(err){console.error(err);$('#view').innerHTML='<div class="panel">Could not open local database. Try opening the app through localhost or HTTPS, and check browser storage permissions.</div>'}})();

</script></body></html>
